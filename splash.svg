<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFF5F8"/>
      <stop offset="100%" stop-color="#FFE4EE"/>
    </linearGradient>
    <filter id="splashShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#FF8FB8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#splashBg)"/>

  <!-- Logo Group -->
  <g transform="translate(540, 900)">
    <circle cx="0" cy="0" r="190" fill="#FFFFFF" filter="url(#splashShadow)"/>
    
    <!-- Flower Petals -->
    <circle cx="0" cy="-90" r="54" fill="#FFB3CD" opacity="0.9"/>
    <circle cx="85" cy="-28" r="54" fill="#FFB3CD" opacity="0.9"/>
    <circle cx="53" cy="73" r="54" fill="#FFB3CD" opacity="0.9"/>
    <circle cx="-53" cy="73" r="54" fill="#FFB3CD" opacity="0.9"/>
    <circle cx="-85" cy="-28" r="54" fill="#FFB3CD" opacity="0.9"/>

    <!-- Flower Center -->
    <circle cx="0" cy="0" r="65" fill="#FFE5A3"/>
    <text x="0" y="24" font-family="'Prompt', sans-serif" font-size="64" font-weight="900" fill="#D97706" text-anchor="middle">฿</text>
  </g>

  <!-- App Title & Tagline -->
  <text x="540" y="1180" font-family="'Prompt', sans-serif" font-size="44" font-weight="700" fill="#5B3A4A" text-anchor="middle">น้องมุก แบ่งเงินรายสัปดาห์</text>
  <text x="540" y="1235" font-family="'Prompt', sans-serif" font-size="26" font-weight="400" fill="#A78695" text-anchor="middle">วางแผนงบประมาณ มีเงินเก็บทุกเดือน 🌸</text>
</svg>
